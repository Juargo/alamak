name: Migrate

# Applies pending Drizzle migrations (ADR-0010, ADR-0016):
# pull requests → Neon branch `preview`; pushes to main → `production`.
# Vercel deploys in parallel, so every migration must be backward compatible (expand/contract).
on:
  pull_request:
    paths: ["drizzle/**"]
  push:
    branches: [main]
    paths: ["drizzle/**"]

concurrency:
  group: migrate-${{ github.event_name == 'push' && 'production' || 'preview' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
